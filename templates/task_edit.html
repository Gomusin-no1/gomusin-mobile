{% extends 'base.html' %}{% block page_title %}고객약속 수정{% endblock %}{% block content %}
<section class="panel narrow"><form method="post" class="stack"><label>약속종류<select name="task_type">{% for v in ['요금제 변경','부가서비스 해지','인터넷 해지','페이백 지급','사은품 지급','재연락','기타'] %}<option {% if t.task_type==v %}selected{% endif %}>{{v}}</option>{% endfor %}</select></label><label>제목<input name="title" value="{{t.title}}" required></label><label>상세내용<textarea name="description">{{t.description or ''}}</textarea></label><label>약속일<input type="date" name="due_date" value="{{t.due_date.isoformat()}}" required></label><label>담당자<select name="assigned_staff"><option value="">미지정</option>{% for u in staff %}{% set nm=u.display_name or u.username %}<option value="{{nm}}" {% if t.assigned_staff==nm %}selected{% endif %}>{{nm}}</option>{% endfor %}</select></label><label>상태<select name="status">{% for v in ['처리예정','완료','연락안됨','연기','취소'] %}<option {% if t.status==v %}selected{% endif %}>{{v}}</option>{% endfor %}</select></label><label>처리/변경 메모<textarea name="result_memo" rows="5">{{t.result_memo or ''}}</textarea></label><div class="action-row">{% include '_task_print_button.html' %}{% if can_print_change_form(t) %}<a class="btn" href="{{url_for('task_change_form',task_id=t.id,review=1)}}">출력정보 확인</a>{% endif %}<a class="btn" href="{{url_for('dashboard',date=t.due_date.isoformat())}}">취소</a><button class="btn primary">수정 저장</button></div></form></section>{% endblock %}
