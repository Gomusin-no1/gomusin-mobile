<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrustFlow 회원가입</title><link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"></head><body class="login-body"><div class="login-card"><div class="login-brand"><h1>TrustFlow</h1><p>Built on Customer Trust</p></div><h2>직원 회원가입</h2>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,m in messages %}<div class="flash {{cat}}">{{m}}</div>{% endfor %}{% endwith %}<form method="post" class="stack"><label>회사 전체아이디<input name="company_code" required></label><label>이름<input name="display_name" required></label><label>휴대전화<input name="phone" inputmode="numeric" required placeholder="01012345678"></label><label>개인아이디<input name="username" required></label><label>개인 비밀번호<input type="password" name="password" minlength="8" required></label><button class="btn primary wide">가입 신청</button></form><div class="auth-links"><a href="{{url_for('login')}}">로그인으로 돌아가기</a></div></div></body></html>
