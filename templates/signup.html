<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>직원 회원가입 · TrustFlow</title><link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"></head><body class="auth-page"><main class="recovery-shell"><a class="recovery-brand" href="{{url_for('login')}}"><strong>TrustFlow</strong><span>Built on Customer Trust</span></a><section class="recovery-card"><header><span class="brand-eyebrow">TEAM ONBOARDING</span><h1>직원 회원가입</h1><p>휴대전화 본인 인증 후 가입을 신청하면 회사 관리자가 최종 승인합니다.</p></header>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,m in messages %}<div class="flash {{cat}}">{{m}}</div>{% endfor %}{% endwith %}<form method="post" class="auth-form"><label><span>1. 회사 전체아이디</span><input name="company_code" value="{{form.get('company_code','')}}" required autocomplete="organization" placeholder="회사에서 안내받은 공용 아이디"></label><div class="verification-grid"><label><span>2. 이름</span><input name="display_name" value="{{form.get('display_name','')}}" required autocomplete="name"></label><label><span>3. 휴대전화</span><input name="phone" value="{{form.get('phone','')}}" inputmode="numeric" autocomplete="tel" required placeholder="01012345678"></label></div><button class="btn wide" type="submit" name="action" value="send" formnovalidate>인증번호 문자로 받기</button>{% if verification_sent %}<label><span>4. 문자 인증번호</span><input name="code" inputmode="numeric" maxlength="6" required placeholder="6자리 인증번호"></label>{% endif %}<label><span>5. 사용할 개인아이디</span><input name="username" value="{{form.get('username','')}}" required autocomplete="username"></label><label><span>6. 개인 비밀번호</span><input type="password" name="password" minlength="8" autocomplete="new-password" required placeholder="8자 이상"></label><button class="btn primary wide" type="submit" name="action" value="register">인증 후 가입 승인 요청</button></form><div class="recovery-foot"><a href="{{url_for('login')}}">로그인으로 돌아가기</a><a href="{{url_for('find_id')}}">아이디 찾기</a></div></section></main></body></html>
