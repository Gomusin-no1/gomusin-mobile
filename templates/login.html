<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrustFlow 로그인</title><link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"></head><body class="login-body"><div class="login-card"><div class="login-brand"><h1>TrustFlow</h1><p>Built on Customer Trust</p></div>{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="flash error">{{m}}</div>{% endfor %}{% endwith %}<form method="post" class="stack"><label>회사 전체아이디<input name="company_code" required autofocus autocomplete="organization" placeholder="회사에서 안내받은 아이디"></label><label>개인아이디<input name="username" required autocomplete="username"></label><label>개인 비밀번호<input type="password" name="password" required autocomplete="current-password"></label><button class="btn primary wide">로그인</button></form><div class="auth-links"><a href="{{url_for('signup')}}">회원가입</a><a href="{{url_for('find_id')}}">아이디 찾기</a><a href="{{url_for('password_help')}}">비밀번호 재설정</a></div></div></body></html>
