{% extends 'base.html' %}{% block title %}직원 수정 · TrustFlow{% endblock %}{% block page_title %}직원 계정 수정{% endblock %}{% block content %}
<section class="panel narrow profile-editor"><div class="profile-head"><div class="profile-avatar">{{(u.display_name or u.username)[0]}}</div><div><span class="account-kicker">{{u.company_code}}</span><h2>{{u.display_name or u.username}}</h2><p>{{u.username}} · {{'사용중' if u.active else '승인대기'}}</p></div></div><form method="post" class="stack"><label>직원명<input name="display_name" value="{{u.display_name or u.username}}" required></label><label>개인아이디<input value="{{u.username}}" readonly></label><label>휴대전화<input name="recovery_phone" inputmode="numeric" value="{{u.recovery_phone or ''}}" placeholder="01012345678"></label><label>소속지점<select name="branch_id"><option value="">미지정</option>{% for b in branches %}<option value="{{b.id}}" {% if u.branch_id==b.id %}selected{% endif %}>{{b.name}}</option>{% endfor %}</select></label><label>권한<select name="role"><option value="staff" {% if u.role=='staff' %}selected{% endif %}>직원</option><option value="admin" {% if u.role=='admin' %}selected{% endif %}>관리자</option><option value="developer" {% if u.role=='developer' %}selected{% endif %}>개발자</option></select></label><label>계정 상태<select name="active"><option value="1" {% if u.active %}selected{% endif %}>사용 승인</option><option value="0" {% if not u.active %}selected{% endif %}>승인대기/사용중지</option></select></label><label>새 비밀번호 <small class="muted">변경할 때만 8자 이상 입력</small><input type="password" name="password" minlength="8" autocomplete="new-password"></label><div class="action-row"><a class="btn" href="{{url_for('staff')}}">취소</a><button class="btn primary">변경사항 저장</button></div></form></section>{% endblock %}
