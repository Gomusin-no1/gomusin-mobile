{% extends 'base.html' %}{% block page_title %}직원 수정{% endblock %}{% block content %}
<section class="panel narrow"><h2>{{u.display_name or u.username}}</h2><form method="post" class="stack"><label>직원명<input name="display_name" value="{{u.display_name or u.username}}" required></label><label>로그인 아이디<input value="{{u.username}}" readonly></label><label>소속지점<select name="branch_id"><option value="">미지정</option>{% for b in branches %}<option value="{{b.id}}" {% if u.branch_id==b.id %}selected{% endif %}>{{b.name}}</option>{% endfor %}</select></label><label>권한<select name="role"><option value="staff" {% if u.role=='staff' %}selected{% endif %}>직원</option><option value="admin" {% if u.role=='admin' %}selected{% endif %}>관리자</option><option value="developer" {% if u.role=='developer' %}selected{% endif %}>개발자</option></select></label><label>재직상태<select name="active"><option value="1" {% if u.active %}selected{% endif %}>재직/활성</option><option value="0" {% if not u.active %}selected{% endif %}>퇴사/비활성</option></select></label><label>새 비밀번호 <small class="muted">(변경할 때만 입력)</small><input type="password" name="password"></label><div class="action-row"><a class="btn" href="{{url_for('staff')}}">취소</a><button class="btn primary">수정 저장</button></div></form></section>{% endblock %}
