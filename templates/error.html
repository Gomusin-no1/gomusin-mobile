<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f9fc"><title>{{code}} · TrustFlow</title><link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"></head><body class="state-body"><main class="error-state"><a class="state-brand" href="{{url_for('login')}}"><strong>TrustFlow</strong><small>Built on Customer Trust</small></a><div class="error-orbit"><span>{{code}}</span></div><span class="account-kicker">TRUSTFLOW GUIDANCE</span><h2>{{title}}</h2><p>{{message}}</p><div class="action-row">{% if session.get('user_id') %}<a class="btn primary" href="{{url_for('dashboard')}}">오늘 업무로 돌아가기</a>{% else %}<a class="btn primary" href="{{url_for('login')}}">로그인 화면으로 돌아가기</a>{% endif %}<button class="btn" type="button" onclick="history.back()">이전 화면</button></div><small>문제가 반복되면 회사 관리자에게 문의해주세요.</small></main></body></html>
