{% extends 'base.html' %}{% block title %}새 문자 캠페인 · TrustFlow{% endblock %}{% block page_title %}새 문자 캠페인{% endblock %}{% block content %}<section class="panel form-panel campaign-editor"><div class="section-head"><span>✦</span><div><h2>월별 고객 자동 발송 계획</h2><p>수신 동의 고객만 개통월 기준으로 추출하고 같은 번호는 한 번만 예약합니다.</p></div></div><form method="post" class="form-grid"><label class="span-2">캠페인명 *<input name="name" required maxlength="120" placeholder="예: 9월 개통고객 감사행사"></label><label>시작 개통월 *<input type="month" name="start_month" required value="{{current_month}}"></label><label>종료 개통월 *<input type="month" name="end_month" required value="{{current_month}}"></label><label>대상 지점<select name="branch_id"><option value="">전체 지점</option>{% for b in branches %}<option value="{{b.id}}">{{b.name}}</option>{% endfor %}</select></label><label>하루 발송 한도 *<input type="number" name="daily_limit" min="1" max="10000" value="100" required></label><label class="span-4">행사 안내 문구 *<textarea name="message" rows="8" maxlength="1500" required></textarea><small>(광고), 발신자, 문의처, 무료수신거부 문구는 자동으로 붙습니다.</small></label><div class="campaign-rule span-4"><b>자동 안전 기준</b><span>수신동의 고객만</span><span>중복 제거</span><span>08:00~21:00 발송</span><span>관리자 승인</span></div><div class="form-actions span-4"><a class="btn" href="{{url_for('sms_campaigns')}}">취소</a><button class="btn primary">대상 추출 및 예약</button></div></form></section>{% endblock %}
