{% extends 'base.html' %}{% block page_title %}내 회원정보{% endblock %}{% block content %}<section class="panel narrow"><h2>회원정보 · 비밀번호 변경</h2><form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{session.profile_csrf}}"><label>이름<input name="display_name" value="{{u.display_name or u.username}}" maxlength="50" required></label><label>연락처<input name="phone" value="{{u.recovery_phone or ''}}" inputmode="tel"></label><label>개인아이디<input value="{{u.username}}" readonly></label><label>현재 비밀번호<input name="current_password" type="password" autocomplete="current-password" required></label><div id="password"><h3>비밀번호 변경</h3><p>변경할 때만 아래 두 칸을 입력하세요.</p></div><label>새 비밀번호<input name="new_password" type="password" minlength="8" autocomplete="new-password"></label><label>새 비밀번호 확인<input name="password_confirm" type="password" minlength="8" autocomplete="new-password"></label><div class="action-row"><a class="btn" href="{{url_for('manager_portal')}}">돌아가기</a><button class="btn primary">저장</button></div></form></section>{% endblock %}
