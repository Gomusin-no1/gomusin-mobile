<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrustFlow 아이디 찾기</title><link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"></head><body class="login-body"><div class="login-card"><div class="login-brand"><h1>TrustFlow</h1><p>Built on Customer Trust</p></div><h2>개인아이디 찾기</h2><form method="post" class="stack"><label>회사 전체아이디<input name="company_code" required></label><label>이름<input name="display_name" required></label><label>휴대전화<input name="phone" inputmode="numeric" required></label><button class="btn primary wide">아이디 확인</button></form>{% if found is not none %}<div class="auth-result">{% if found %}개인아이디는 <strong>{{found}}</strong>입니다.{% else %}일치하는 계정을 찾지 못했습니다.{% endif %}</div>{% endif %}<div class="auth-links"><a href="{{url_for('login')}}">로그인으로 돌아가기</a></div></div></body></html>
