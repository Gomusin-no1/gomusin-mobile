services:
  - type: web
    name: gomusin-mobile-v2
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: true
      - key: NAS_WEBDAV_URL
        sync: false
      - key: NAS_WEBDAV_USERNAME
        sync: false
      - key: NAS_WEBDAV_PASSWORD
        sync: false
      - key: DOCUMENT_ENCRYPTION_KEY
        sync: false
      - key: NAS_SYNC_TOKEN
        sync: false
