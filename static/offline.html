<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b62"><title>TrustFlow 연결 확인</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f8fc;color:#173b62;font-family:system-ui,sans-serif}.card{width:min(420px,calc(100% - 48px));padding:36px;border:1px solid #dce6f0;border-radius:24px;background:#fff;box-shadow:0 20px 60px rgba(23,59,98,.12);text-align:center}.mark{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 20px;border-radius:18px;background:linear-gradient(135deg,#173b62,#168c77);color:#fff;font-weight:900;font-size:22px}h1{font-size:24px}p{color:#65788e;line-height:1.7}button{margin-top:10px;padding:13px 20px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:800}</style></head><body><main class="card"><div class="mark">TF</div><h1>인터넷 연결을 확인해 주세요</h1><p>TrustFlow는 고객 정보를 기기에 저장하지 않습니다. 연결이 복구되면 안전하게 다시 업무를 시작할 수 있습니다.</p><button onclick="location.reload()">다시 연결</button></main></body></html>
